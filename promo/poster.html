<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>柴柴生存伺服器宣傳圖</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1080px; height: 1350px; margin: 0; overflow: hidden; }
    body { font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; color: #f1eee4; background: #080b09; }
    .poster { position: relative; display: flex; width: 1080px; height: 1350px; flex-direction: column; overflow: hidden; padding: 58px 64px 52px; }
    .background, .shade { position: absolute; inset: 0; }
    .background { width: 100%; height: 100%; object-fit: cover; }
    .shade { background: linear-gradient(90deg, rgba(6,9,7,.92) 0%, rgba(6,9,7,.63) 56%, rgba(6,9,7,.18) 100%), linear-gradient(0deg, rgba(5,8,6,.96) 0%, transparent 68%); }
    .content { position: relative; z-index: 1; display: flex; min-height: 100%; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 18px; }
    .brand img { width: 76px; height: 76px; border: 1px solid rgba(255,255,255,.16); border-radius: 22px; box-shadow: 0 18px 36px rgba(0,0,0,.32); }
    .brand-copy { display: grid; gap: 3px; }
    .brand-copy strong { font-size: 24px; letter-spacing: .18em; }
    .brand-copy span { color: #aaa99f; font-size: 17px; }
    .hero-copy { width: 790px; margin-top: 72px; }
    .eyebrow { color: #b5cc9b; font-size: 19px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 19px 0 20px; font-size: 76px; line-height: 1.08; letter-spacing: -.055em; }
    .tagline { max-width: 700px; margin: 0; color: #d7d4ca; font-size: 34px; font-weight: 650; line-height: 1.45; }
    .chips { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 30px; }
    .chip { padding: 10px 15px; border: 1px solid rgba(181,204,155,.25); border-radius: 999px; background: rgba(19,27,21,.68); color: #d8e5ca; font-size: 17px; font-weight: 700; backdrop-filter: blur(10px); }
    .panel { margin-top: auto; padding: 30px 32px 28px; border: 1px solid rgba(255,255,255,.13); border-radius: 30px; background: rgba(10,14,11,.88); box-shadow: 0 28px 70px rgba(0,0,0,.38); backdrop-filter: blur(24px); }
    .join-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; padding-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,.1); }
    .join-row h2 { margin: 0 0 7px; font-size: 31px; }
    .join-row p { margin: 0; color: #aaa99f; font-size: 16px; }
    .addresses { display: grid; gap: 8px; text-align: right; }
    .address { color: #dedbd1; font-family: Consolas, monospace; font-size: 17px; }
    .address b { margin-right: 8px; color: #b5cc9b; font-family: "Microsoft JhengHei", sans-serif; font-size: 13px; letter-spacing: .09em; }
    .qr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 24px; }
    .qr-card { display: grid; grid-template-columns: 180px 1fr; align-items: center; gap: 20px; min-height: 206px; padding: 13px 18px 13px 13px; border: 1px solid rgba(255,255,255,.1); border-radius: 22px; background: rgba(255,255,255,.035); }
    .qr-card img { width: 180px; height: 180px; border-radius: 14px; background: white; }
    .qr-copy { display: grid; gap: 7px; }
    .qr-copy span { color: #b5cc9b; font-size: 14px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .qr-copy strong { font-size: 24px; line-height: 1.25; }
    .qr-copy small { color: #aaa99f; font-size: 13px; line-height: 1.5; word-break: break-word; }
  </style>
</head>
<body>
  <main class="poster">
    <img class="background" src="survival-promo-background.png" alt="">
    <div class="shade"></div>
    <div class="content">
      <header class="brand">
        <img src="chaihome-mark.png" alt="柴柴標誌">
        <div class="brand-copy"><strong>CHAIHOME</strong><span>柴柴生存伺服器</span></div>
      </header>
      <section class="hero-copy">
        <div class="eyebrow">Minecraft Survival Server</div>
        <h1>柴柴生存<br>伺服器</h1>
        <p class="tagline">熟悉的生存，多一點便利。</p>
        <div class="chips"><span class="chip">Java × Bedrock</span><span class="chip">連鎖採集</span><span class="chip">遊玩保護</span><span class="chip">HUD 資訊</span></div>
      </section>
      <section class="panel">
        <div class="join-row">
          <div><h2>選擇你的版本，開始生存。</h2><p>掃描 QR Code 查看完整介紹，或加入 Discord 社群。</p></div>
          <div class="addresses"><div class="address"><b>JAVA</b>chaihome.cc</div><div class="address"><b>BEDROCK</b>bedrock.chaihome.cc · 55500</div></div>
        </div>
        <div class="qr-grid">
          <article class="qr-card"><img src="website-qr.png" alt="官方網站 QR Code"><div class="qr-copy"><span>Official Site</span><strong>官方網站</strong><small>play.chaihome.cc</small></div></article>
          <article class="qr-card"><img src="discord-qr.png" alt="Discord QR Code"><div class="qr-copy"><span>Community</span><strong>Discord</strong><small>discord.gg/prW39Wa58n</small></div></article>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
